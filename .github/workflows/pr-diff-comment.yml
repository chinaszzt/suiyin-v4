name: PR Documentation Diff Comparison

# 在 Cloudflare Pages 给每个 PR 部署完 preview 后触发，
# 在 PR 上贴一张「文件清单 + main / PR 双链接」对比表，
# 业务专家点链接开两个 tab 自己肉眼对照。
#
# Cloudflare Pages 用 GitHub Check Runs（不是 Deployments API）上报
# 部署状态，所以这里监听 check_run completed，从 output.summary 提取
# preview URL（HTML 表格里的 commit-specific Preview URL，不是 Branch URL）。

on:
  check_run:
    types: [completed]

permissions:
  pull-requests: write
  contents: read

env:
  PRODUCTION_URL: https://suiyin-v4.pages.dev
  DOCS_DIR: docs/sdd
  MARKER: pr-diff-comparison-bot

jobs:
  comment:
    if: |
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Extract preview URL from check_run output
        id: extract
        env:
          SUMMARY: ${{ github.event.check_run.output.summary }}
        run: |
          # PRODUCTION_URL 形如 https://suiyin-v4.pages.dev → host = suiyin-v4.pages.dev
          HOST="${PRODUCTION_URL#https://}"
          HOST="${HOST%/}"

          # 提取 commit-specific Preview URL（8 位 hex hash 子域名），
          # 排除 Branch Preview URL（带连字符的 branch slug 子域名）。
          PR_URL=$(printf '%s' "$SUMMARY" \
            | grep -oE "https://[0-9a-f]{8}\.${HOST}" \
            | head -1 || true)

          if [ -z "$PR_URL" ]; then
            echo "::warning::Failed to extract preview URL; check_run output may have changed format"
            echo "::group::summary"
            printf '%s\n' "$SUMMARY"
            echo "::endgroup::"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Preview URL: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Find PR number from check_run sha
        id: pr
        if: steps.extract.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.check_run.head_sha }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "No open PR for sha $SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found PR #$PR"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.extract.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.head_sha }}

      - name: Generate comparison table
        if: steps.extract.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.extract.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PR_URL_NORM="${PR_URL%/}"
          PROD_URL_NORM="${PRODUCTION_URL%/}"

          # PR 改动的 docs/ 下 .md 文件清单
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only \
            | grep -E "^${DOCS_DIR}/.*\.md\$" || true)

          {
            echo "<!-- ${MARKER} -->"
            echo "## 📄 文档 PR Review 对比表"
            echo ""
            echo "> 点 \`main\` / \`PR\` 链接，浏览器开两个 tab 肉眼对照看。改动文件标 🔄。"
            echo ""
            echo "| 文件 | 状态 | main 版 | PR 版 |"
            echo "|---|:---:|---|---|"

            # 列 PR head 上 docs/ 下所有 .md
            find "$DOCS_DIR" -type f -name '*.md' | sort | while read -r f; do
              rel="${f#${DOCS_DIR}/}"
              url_path="${rel%.md}/"

              if echo "$CHANGED" | grep -qFx "$f"; then
                status="🔄"
              else
                status=""
              fi

              echo "| \`${rel}\` | ${status} | [main](${PROD_URL_NORM}/${url_path}) | [PR](${PR_URL_NORM}/${url_path}) |"
            done

            echo ""
            echo "<sub>由 \`.github/workflows/pr-diff-comment.yml\` 自动生成；每次 Cloudflare preview 部署成功时刷新。</sub>"
          } > comment.md

          echo "===== generated comment ====="
          cat comment.md

      - name: Post or update PR comment
        if: steps.extract.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          EXISTING_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | .[0].id // empty")

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing comment $EXISTING_ID"
            jq -nc --arg body "$(cat comment.md)" '{body: $body}' \
              | gh api --method PATCH \
                  "repos/${{ github.repository }}/issues/comments/${EXISTING_ID}" \
                  --input -
          else
            echo "Posting new comment"
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
