# lefthook 配置 — C4 Verify Contract 本地实现 (P0 实现谱系 (a))
#
# 业务项目用 v4 提供的 install 命令 (P1+) 自动选择 Python / Dart 模板.
# 本仓 (v4 自己) 用 Python 模板 (suiyin-flow 本体是 Python 写的).
#
# 安装:
#   brew install lefthook   # macOS
#   或 npm i -g lefthook    # 跨平台 npm 渠道
#   lefthook install        # 安装 git hooks 到 .git/hooks/
#
# 跑一次:
#   lefthook run pre-commit
#   lefthook run pre-push

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.py"
      run: ruff check src tests
    typecheck:
      glob: "*.py"
      run: mypy

pre-push:
  commands:
    tests:
      run: pytest tests -q

