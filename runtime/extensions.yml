installed:
- git
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
  - extension: git
    command: sy.git.initialize
    enabled: true
    optional: false
    prompt: Execute sy.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  # v4 OVERRIDE: before_specify disabled by default — rationale in docs/sdd/adrs/0004-*.md.
  # v4 is worktree-centric (devs pre-create the worktree + branch before the session), which
  # conflicts with spec-kit's "every /sy-specify cuts a new NNN-<name> branch". To restore
  # spec-kit upstream behavior, set `enabled: true` below — `optional` stays false, so the
  # hook then runs automatically, exactly like upstream (flip `enabled` alone, nothing else).
  before_specify:
  - extension: git
    command: sy.git.feature
    enabled: false                    # v4 OVERRIDE — upstream default is true
    optional: false                   # unchanged from upstream; flip `enabled` alone to restore
    prompt: Execute sy.git.feature?
    description: Create feature branch before specification (disabled by default in v4 — see ADR-0004)
    condition: null
  before_clarify:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  before_tasks:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  before_implement:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  before_checklist:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  # ─────────────────────────────────────────────────────────────────
  # CONSTITUTION BOOTSTRAP SPECIAL CASE
  # Constitution is the project foundation; team-wide visibility is critical.
  # ALL role-profiles (A/B/C/D) force auto-commit + auto-push here.
  # See docs/sdd/role-profiles.md "Bootstrap 特例" section.
  # ─────────────────────────────────────────────────────────────────
  after_constitution:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: false                                                    # MANDATORY (all profiles)
    prompt: Commit constitution changes (mandatory for all profiles)
    description: Auto-commit after constitution update (bootstrap)
    condition: null
  - extension: git
    command: sy.git.push
    enabled: true
    optional: false                                                    # MANDATORY (all profiles)
    prompt: Push constitution to remote (mandatory for all profiles)
    description: Auto-push constitution to origin (bootstrap, team visibility)
    condition: null
  after_specify:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  after_clarify:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  after_tasks:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  after_implement:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  after_checklist:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  after_taskstoissues:
  - extension: git
    command: sy.git.commit
    enabled: true
    optional: true
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
